<svg xmlns="http://www.w3.org/2000/svg" xmlns:h="http://www.w3.org/1999/xhtml" width="500" height="100"><title>SVG Paint Servers: only a specified gradientTransform stops template inheritance.</title><metadata><h:link href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#PaintServerTemplates" rel="help"/><h:link href="https://w3c.github.io/svgwg/svg2-draft/pservers.html#LinearGradientElementGradientTransformAttribute" rel="help"/><h:link href="reference/gradient-transform-template-inheritance-ref.svg" rel="match"/></metadata><defs><linearGradient id="linear-base" gradientTransform="rotate(90 0.5 0.5)"><stop offset="0" stop-color="green"/><stop offset="1" stop-color="#00f"/></linearGradient><linearGradient id="linear-empty" href="#linear-base"/><linearGradient id="linear-invalid" gradientTransform="bogus" href="#linear-base"/><linearGradient id="linear-absent" href="#linear-base"/><linearGradient id="linear-svgdom" href="#linear-base"/><radialGradient id="radial-base" gradientTransform="scale(2)"><stop offset="0" stop-color="#ff0"/><stop offset="1" stop-color="red"/></radialGradient><radialGradient id="radial-whitespace" href="#radial-base"/></defs><rect width="80" height="80" x="10" y="10" fill="url(#linear-empty)"/><rect width="80" height="80" x="110" y="10" fill="url(#linear-invalid)"/><rect width="80" height="80" x="210" y="10" fill="url(#linear-absent)"/><rect width="80" height="80" x="310" y="10" fill="url(#radial-whitespace)"/><rect width="80" height="80" x="410" y="10" fill="url(#linear-svgdom)"/><script><![CDATA[
    var transform = document.documentElement.createSVGTransform();
    transform.setTranslate(0.5, 0);
    document.getElementById("linear-svgdom").gradientTransform.baseVal.appendItem(transform);
  ]]></script></svg>